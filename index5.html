<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北海道冬季溫泉行程</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',sans-serif;background:#f5f7fa;color:#333;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.top-bar{background:linear-gradient(135deg,#1565c0,#1e88e5);padding:9px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:200}
.top-bar h1{font-size:.92rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-bar .tmeta{font-size:.7rem;color:#bbdefb;margin-left:auto;white-space:nowrap}

.day-tabs{background:#fff;display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #e0e0e0;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.06);z-index:199}
.day-tabs::-webkit-scrollbar{display:none}
.dtab{flex-shrink:0;padding:8px 14px;cursor:pointer;font-size:.76rem;color:#9e9e9e;border-bottom:2.5px solid transparent;transition:all .25s;text-align:center;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.dtab:hover{color:#1976d2;background:rgba(25,118,210,.04)}
.dtab.active{color:#1565c0;border-bottom-color:#1565c0;background:rgba(21,101,192,.06);font-weight:700}
.dtab .dd{font-weight:700;font-size:.8rem}
.dtab .dl{font-size:.65rem;opacity:.75;margin-top:1px}

.fbar{background:#fafafa;padding:5px 10px;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #eee;flex-shrink:0}
.fbar::-webkit-scrollbar{display:none}
.fbtn{flex-shrink:0;padding:4px 11px;border-radius:14px;border:1px solid #ddd;background:#fff;color:#757575;font-size:.72rem;cursor:pointer;white-space:nowrap;font-family:inherit}
.fbtn:hover{border-color:#90caf9;color:#1976d2;background:#e3f2fd}
.fbtn.active{background:#1565c0;border-color:#1565c0;color:#fff}

.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:390px;min-width:310px;background:#fff;display:flex;flex-direction:column;border-right:1px solid #e0e0e0;flex-shrink:0}
.shdr{padding:10px 12px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:9px;background:#fafafa}
.dbadge{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#fff;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.dtitle{font-size:.92rem;font-weight:700;color:#212121}
.dsub{font-size:.72rem;color:#1976d2;margin-top:1px}

.dayroute{padding:6px 12px;background:#eef4fb;border-bottom:1px solid #dbe7f3;font-size:.72rem;flex-shrink:0}
.dayroute a{color:#1565c0;font-weight:600}
.dayroute .rnote{color:#78909c;margin-top:2px;font-size:.68rem}

.slist{flex:1;overflow-y:auto;padding:6px 8px;background:#fafafa}
.slist::-webkit-scrollbar{width:5px}
.slist::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}

.scard{padding:10px 12px;margin-bottom:6px;border-radius:10px;border:1px solid #e8e8e8;background:#fff;cursor:pointer;transition:all .2s}
.scard:hover{background:#e3f2fd;border-color:#90caf9}
.scard.active{background:#e3f2fd;border-color:#1565c0;box-shadow:0 2px 12px rgba(21,101,192,.15)}
.scard.nocoord{border-left:4px solid #f0a500}
.stime{font-size:.67rem;color:#1976d2;font-weight:600}
.sname{font-size:.86rem;font-weight:600;color:#212121;margin:2px 0}
.sdesc{font-size:.74rem;color:#757575;line-height:1.45}
.saddr{font-size:.7rem;color:#90a4ae;margin-top:3px}

.tbadge{display:inline-block;padding:1px 7px;border-radius:8px;font-size:.62rem;font-weight:600;margin-left:5px}
.t-sight{background:#e3f2fd;color:#1565c0}
.t-food{background:#fff3e0;color:#e65100}
.t-hotel{background:#f3e5f5;color:#7b1fa2}
.t-transport{background:#e0f7fa;color:#00838f}
.t-onsen{background:#e8f5e9;color:#2e7d32}

.fdbox{margin-top:5px;padding:5px 8px;background:#fff8e1;border-radius:6px;border:1px solid #ffe082}
.fr{font-size:.72rem;line-height:1.4}
.fm{color:#c62828}
.fv{color:#2e7d32}

.cstat{font-size:.68rem;margin-top:6px}
.cstat.ok{color:#546e7a}
.cstat.warn{color:#b45309;font-weight:600}

.actions{margin-top:7px;display:flex;flex-wrap:wrap;gap:8px}
.actions a{font-size:.72rem;text-decoration:none;padding:4px 10px;border-radius:6px;line-height:1.5;display:inline-block}

/* 提高權重，蓋過 Leaflet 的 .leaflet-container a */
.actions a.a-place,
.leaflet-popup-content .actions a.a-place{
  color:#1565c0;
  background:#e3f2fd;
  border:1px solid #bbdefb;
}

.actions a.a-nav,
.leaflet-popup-content .actions a.a-nav{
  color:#ffffff;
  background:#1565c0;
  font-weight:600;
}

.actions a.a-nav.weak,
.leaflet-popup-content .actions a.a-nav.weak{
  color:#3d2b00;
  background:#f0a500;
}

.actions a.a-nav-in,
.leaflet-popup-content .actions a.a-nav-in{
  color:#1565c0;
  background:#ffffff;
  border:1.5px solid #1565c0;
  font-weight:600;
}

.actions a.a-nav-in.weak,
.leaflet-popup-content .actions a.a-nav-in.weak{
  color:#7a4b00;
  background:#fff8e1;
  border-color:#f0a500;
}
.actions a:hover{opacity:.85}
.a-nav.weak{background:#f0a500}
.navnote{font-size:.66rem;color:#b45309;margin-top:4px}

.snav{padding:7px 12px;border-top:1px solid #eee;display:flex;gap:7px;flex-shrink:0;background:#fafafa}
.nbtn{flex:1;padding:8px;border-radius:8px;border:1px solid #bbdefb;background:#e3f2fd;color:#1565c0;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit}
.nbtn:hover{background:#bbdefb}

.mapwrap{flex:1;position:relative}
#map{width:100%;height:100%;z-index:1}
.legend{position:absolute;bottom:14px;right:14px;background:rgba(255,255,255,.94);border:1px solid #ddd;border-radius:10px;padding:9px 12px;z-index:500;font-size:.71rem;color:#555;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.legend div{margin-bottom:4px;display:flex;align-items:center;gap:6px}
.ldot{width:11px;height:11px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}

.nbar{background:#fffde7;border-top:1px solid #fff176;padding:6px 14px;font-size:.68rem;color:#6d4c00;display:flex;gap:14px;flex-wrap:wrap;flex-shrink:0;max-height:64px;overflow-y:auto}
.nbar strong{color:#e65100}

.leaflet-popup-content-wrapper{border-radius:12px!important}
.leaflet-popup-content{font-family:'Noto Sans TC',sans-serif!important;font-size:.8rem!important;line-height:1.5!important;margin:10px 13px!important;max-width:280px}
.leaflet-popup-content .pn{font-weight:700;font-size:.9rem;margin-bottom:3px}
.leaflet-popup-content .pt{font-size:.66rem;padding:2px 8px;border-radius:8px;display:inline-block;margin-bottom:5px;background:#eceff1;color:#455a64}
.leaflet-popup-content .pd{color:#616161;font-size:.76rem}

.loading{position:fixed;inset:0;background:#f5f7fa;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:9999;padding:24px;text-align:center}
.spinner{width:38px;height:38px;border:4px solid #e0e0e0;border-top-color:#1565c0;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:900px){
.main{flex-direction:column}
.sidebar{width:100%;min-width:auto;max-height:46vh;border-right:none;border-bottom:1px solid #e0e0e0}
.mapwrap{min-height:260px}
.legend{bottom:8px;right:8px;padding:6px 9px;font-size:.62rem}
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p id="loadingMsg">載入行程資料中…</p>
</div>

<div class="top-bar">
  <span style="font-size:1.2rem">❄️</span>
  <h1 id="tripTitle">載入中…</h1>
  <div class="tmeta" id="tripDate"></div>
</div>

<nav class="day-tabs" id="dayTabs" aria-label="日期導覽"></nav>

<div class="fbar" id="filterBar"></div>

<div class="main">
  <div class="sidebar">
    <div class="shdr">
      <div class="dbadge" id="hBadge" style="background:linear-gradient(135deg,#1565c0,#42a5f5)">ALL</div>
      <div>
        <div class="dtitle" id="hTitle">—</div>
        <div class="dsub" id="hSub">—</div>
      </div>
    </div>
    <div class="dayroute" id="dayRoute" hidden></div>
    <div class="slist" id="sList"></div>
    <div class="snav">
      <button class="nbtn" id="prevBtn" type="button">◀ 上一站</button>
      <button class="nbtn" id="nextBtn" type="button">下一站 ▶</button>
    </div>
  </div>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="legend">
      <div><span class="ldot" style="background:#1565c0"></span>景點</div>
      <div><span class="ldot" style="background:#e65100"></span>餐廳</div>
      <div><span class="ldot" style="background:#7b1fa2"></span>住宿</div>
      <div><span class="ldot" style="background:#00838f"></span>交通</div>
      <div><span class="ldot" style="background:#2e7d32"></span>溫泉</div>
      <div style="margin-top:3px;color:#1565c0;font-weight:600">圓內數字＝Day</div>
    </div>
  </div>
</div>

<div class="nbar" id="notesBar"></div>

<script>
'use strict';

const TC = {sight:'#1565c0', food:'#e65100', hotel:'#7b1fa2', transport:'#00838f', onsen:'#2e7d32'};
const TL = {sight:'景點', food:'餐廳', hotel:'住宿', transport:'交通', onsen:'溫泉'};
const TB = {sight:'t-sight', food:'t-food', hotel:'t-hotel', transport:'t-transport', onsen:'t-onsen'};

const FILTERS = [
  {key:'all', label:'📍 全部'},
  {key:'sight', label:'🏔 景點'},
  {key:'food', label:'🍽 餐廳'},
  {key:'hotel', label:'🏨 住宿'},
  {key:'transport', label:'✈ 交通'},
  {key:'onsen', label:'♨ 溫泉'}
];

let DATA = null;
let spots = [];
let days = [];
let cDay = 0;
let cFil = 'all';
let cIdx = -1;
let fList = [];
let markers = [];

/* ---------- 地圖 ---------- */
const map = L.map('map', {zoomControl:true}).setView([42.9, 141.1], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom:19
}).addTo(map);

/* ---------- 工具 ---------- */
function hasCoordinates(s){
  return Number.isFinite(s.lat) && Number.isFinite(s.lng) &&
         s.lat >= -90 && s.lat <= 90 && s.lng >= -180 && s.lng <= 180;
}

function coordinateLabel(s){
  if(!hasCoordinates(s)) return '座標待補：未建立圖釘，導航用名稱搜尋';
  const labels = {
    source_listed:'來源列示座標；非入口保證',
    building_reference:'建築參考位置；請確認入口',
    area_reference:'區域參考位置',
    pending:'已有座標，但尚待核實'
  };
  const st = typeof s.coordinateStatus === 'string' ? s.coordinateStatus.trim() : '';
  if(Object.prototype.hasOwnProperty.call(labels, st)) return labels[st];
  if(!st) return '已有座標，但未提供核對狀態';
  return '無法辨識座標狀態：' + st;
}

function safeLink(url){
  try{
    const u = new URL(url);
    return ['https:','http:'].includes(u.protocol) ? u.href : null;
  }catch{ return null; }
}

function mapsQuery(s){
  if(hasCoordinates(s)) return s.lat + ',' + s.lng;
  return s.address || s.name || '';
}

function defaultMode(a, b){
  const far = ['transport','hotel'];
  return (far.includes(a.type) || far.includes(b.type)) ? 'transit' : 'walking';
}

function directionsUrl(a, b, mode){
  const origin = mapsQuery(a);
  const destination = mapsQuery(b);
  if(!origin || !destination) return null;
  const p = new URLSearchParams({
    api:'1', origin, destination,
    travelmode: mode || defaultMode(a, b)
  });
  return 'https://www.google.com/maps/dir/?' + p.toString();
}

/* 找出「前一天的最後一個點」
   以完整行程 spots 為準，不受目前的日期／類型篩選影響，
   因為實際移動不會因為畫面篩選而改變。 */
function lastSpotOfPreviousDay(spot){
  const prevDays = spots.filter(s => s.day < spot.day).map(s => s.day);
  if(!prevDays.length) return null;              // Day 1 或更早沒有資料
  const prevDay = Math.max(...prevDays);
  const list = spots.filter(s => s.day === prevDay);
  const hotels = list.filter(s => s.type === 'hotel');
  return hotels.length ? hotels[hotels.length - 1] : (list[list.length - 1] || null);
}

/* 判斷是否為當前清單中該日的第一個項目 */
function isFirstOfDay(i){
  return i === 0 || fList[i - 1].day !== fList[i].day;
}

function dayRouteUrl(list){
  const pts = list.filter(hasCoordinates);
  if(pts.length < 2) return null;
  const p = new URLSearchParams({
    api:'1',
    origin: mapsQuery(pts[0]),
    destination: mapsQuery(pts[pts.length-1]),
    travelmode:'driving'
  });
  const way = pts.slice(1,-1).slice(0,8).map(mapsQuery).join('|');
  if(way) p.set('waypoints', way);
  return 'https://www.google.com/maps/dir/?' + p.toString();
}

function makeLink(url, text, cls){
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  a.textContent = text;
  if(cls) a.className = cls;
  a.addEventListener('click', e => e.stopPropagation());
  return a;
}

/* ---------- 標記 ---------- */
function mkIcon(type, day, active){
  const c = TC[type] || '#1565c0';
  const sz = active ? 38 : 28;
  return L.divIcon({
    className:'',
    html:'<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+c+
         ';border:'+(active?'3px solid #ff9800':'2.5px solid #fff')+
         ';display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:'+
         (active?14:11)+'px;font-family:\'Noto Sans TC\',sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.3)">'+day+'</div>',
    iconSize:[sz,sz], iconAnchor:[sz/2,sz/2], popupAnchor:[0,-(sz/2+4)]
  });
}

function popupContent(s, next){
  const box = document.createElement('div');
  const add = (t, cls) => { if(!t) return; const d=document.createElement('div'); d.className=cls; d.textContent=t; box.appendChild(d); };
  add(s.name, 'pn');
  add('D' + s.day + ' ' + (s.time || ''), 'pt');
  add(s.description, 'pd');
  add(s.address, 'pd');
  add(s.meat, 'pd');
  add(s.veg, 'pd');
  add(coordinateLabel(s), 'pd');

  const wrap = document.createElement('div');
  wrap.className = 'actions';
  const place = safeLink(s.googleMapsUrl);
  if(place) wrap.appendChild(makeLink(place, '在 Google Maps 開啟', 'a-place'));
   const idx = fList.indexOf(s);
  const prevEnd = (idx >= 0 && isFirstOfDay(idx)) ? lastSpotOfPreviousDay(s) : null;
  if(prevEnd){
    const urlIn = safeLink(directionsUrl(prevEnd, s));
    if(urlIn){
      const weakIn = !hasCoordinates(prevEnd) || !hasCoordinates(s);
      wrap.appendChild(makeLink(urlIn, '← 從前一天最後一站導航', 'a-nav-in' + (weakIn?' weak':'')));
    }
  }
  if(next){
    const nav = safeLink(directionsUrl(s, next));
    if(nav){
      const weak = !hasCoordinates(s) || !hasCoordinates(next);
      wrap.appendChild(makeLink(nav, '導航到下一站', 'a-nav' + (weak?' weak':'')));
    }
  }
  if(wrap.children.length) box.appendChild(wrap);
  return box;
}

function renderMarkers(){
  markers.forEach(m => { if(m) map.removeLayer(m); });
  markers = new Array(fList.length).fill(null);

  fList.forEach((s, i) => {
    if(!hasCoordinates(s)) return;
    const next = (fList[i+1] && fList[i+1].day === s.day) ? fList[i+1] : null;
    const m = L.marker([s.lat, s.lng], {
      icon: mkIcon(s.type, s.day, i === cIdx),
      zIndexOffset: i === cIdx ? 1000 : 0
    }).addTo(map);
    m.bindPopup(popupContent(s, next), {maxWidth:300});
    m.bindTooltip(s.name, {direction:'top', offset:[0,-16]});
    m.on('click', () => selectSpot(i));
    markers[i] = m;
  });
}

function fitMap(){
  const sel = fList[cIdx];
  if(sel && hasCoordinates(sel)){ map.setView([sel.lat, sel.lng], 16, {animate:true}); return; }
  const vis = markers.filter(Boolean);
  if(!vis.length){ map.setView([42.9,141.1], 8); return; }
  map.fitBounds(L.featureGroup(vis).getBounds(), {padding:[35,35], maxZoom:15, animate:true});
}

/* ---------- 清單 ---------- */
function buildCard(s, i, next){
  const card = document.createElement('div');
  card.className = 'scard' + (i === cIdx ? ' active' : '') + (hasCoordinates(s) ? '' : ' nocoord');
  card.addEventListener('click', () => selectSpot(i));

  const time = document.createElement('div');
  time.className = 'stime';
  time.textContent = 'D' + s.day + ' ' + (s.time || '');
  const badge = document.createElement('span');
  badge.className = 'tbadge ' + (TB[s.type] || '');
  badge.textContent = TL[s.type] || s.type;
  time.appendChild(badge);
  card.appendChild(time);

  const name = document.createElement('div');
  name.className = 'sname';
  name.textContent = s.name;
  card.appendChild(name);

  if(s.description){
    const d = document.createElement('div');
    d.className = 'sdesc'; d.textContent = s.description;
    card.appendChild(d);
  }
  if(s.address){
    const a = document.createElement('div');
    a.className = 'saddr'; a.textContent = s.address;
    card.appendChild(a);
  }
  if(s.meat || s.veg){
    const box = document.createElement('div');
    box.className = 'fdbox';
    if(s.meat){ const r=document.createElement('div'); r.className='fr fm'; r.textContent=s.meat; box.appendChild(r); }
    if(s.veg){ const r=document.createElement('div'); r.className='fr fv'; r.textContent=s.veg; box.appendChild(r); }
    card.appendChild(box);
  }

  const st = document.createElement('div');
  st.className = 'cstat ' + (hasCoordinates(s) ? 'ok' : 'warn');
  st.textContent = coordinateLabel(s);
  card.appendChild(st);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const place = safeLink(s.googleMapsUrl);
  if(place) actions.appendChild(makeLink(place, 'Google Maps 開啟 ↗', 'a-place'));

  let weakNav = false;

  /* ① 每天第一站：從前一天最後一個點導航過來 */
  const prevEnd = isFirstOfDay(i) ? lastSpotOfPreviousDay(s) : null;
  if(prevEnd){
    const urlIn = safeLink(directionsUrl(prevEnd, s));
    if(urlIn){
      const weakIn = !hasCoordinates(prevEnd) || !hasCoordinates(s);
      if(weakIn) weakNav = true;
      const modeIn = defaultMode(prevEnd, s) === 'transit' ? '大眾運輸' : '步行';
      actions.appendChild(
        makeLink(urlIn,
          '← 從「' + prevEnd.name + '」導航到這裡（' + modeIn + '）',
          'a-nav-in' + (weakIn ? ' weak' : ''))
      );
    }
  }

  /* ② 導航到同一天的下一站 */
  if(next){
    const urlOut = safeLink(directionsUrl(s, next));
    if(urlOut){
      const weakOut = !hasCoordinates(s) || !hasCoordinates(next);
      if(weakOut) weakNav = true;
      const modeOut = defaultMode(s, next) === 'transit' ? '大眾運輸' : '步行';
      actions.appendChild(
        makeLink(urlOut,
          '→ 導航到「' + next.name + '」（' + modeOut + '）',
          'a-nav' + (weakOut ? ' weak' : ''))
      );
    }
  }

  if(actions.children.length) card.appendChild(actions);

  if(weakNav){
    const w = document.createElement('div');
    w.className = 'navnote';
    w.textContent = '此處有地點未確認座標，導航以名稱搜尋，請先核對再出發。';
    card.appendChild(w);
  }

  return card;
}

function renderList(){
  fList = spots.filter(s => (cDay === 0 || s.day === cDay) && (cFil === 'all' || s.type === cFil));

  const el = document.getElementById('sList');
  el.replaceChildren();

  if(!fList.length){
    const p = document.createElement('div');
    p.style.cssText = 'padding:2rem;text-align:center;color:#999;font-size:.85rem';
    p.textContent = '此篩選條件下沒有項目。';
    el.appendChild(p);
    renderMarkers();
    renderDayRoute();
    return;
  }

  fList.forEach((s, i) => {
    const next = (fList[i+1] && fList[i+1].day === s.day) ? fList[i+1] : null;
    el.appendChild(buildCard(s, i, next));
  });

  renderMarkers();
  renderDayRoute();
}

function renderDayRoute(){
  const box = document.getElementById('dayRoute');
  box.replaceChildren();

  const url = cDay === 0 ? null : safeLink(dayRouteUrl(fList));
  if(!url){ box.hidden = true; return; }

  box.hidden = false;
  box.appendChild(makeLink(url, '🗺 用 Google Maps 開啟本日路線（駕車模式）'));
  const note = document.createElement('div');
  note.className = 'rnote';
  note.textContent = '多點路線僅支援駕車模式，只供順序參考；未確認座標的點不會納入。';
  box.appendChild(note);
}

/* ---------- 互動 ---------- */
function selectSpot(i){
  if(!Number.isInteger(i) || i < 0 || i >= fList.length) return;
  cIdx = i;
  map.closePopup();
  renderList();

  const s = fList[i];
  const m = markers[i];
  if(m && hasCoordinates(s)){
    map.setView([s.lat, s.lng], 16, {animate:false});
    m.openPopup();
  }else{
    document.getElementById('hSub').textContent = '此地點座標待確認，請用卡片內的 Google Maps 連結。';
  }
  const card = document.querySelectorAll('.scard')[i];
  if(card) card.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function nav(dir){
  if(!fList.length) return;
  let n = cIdx + dir;
  if(n < 0) n = fList.length - 1;
  if(n >= fList.length) n = 0;
  selectSpot(n);
}

function setDay(d){
  cDay = d; cIdx = -1;
  document.querySelectorAll('.dtab').forEach(t => {
    const on = Number(t.dataset.day) === d;
    t.classList.toggle('active', on);
    t.setAttribute('aria-current', on ? 'true' : 'false');
  });
  const info = days.find(x => x.day === d) || days[0] || {};
  const badge = document.getElementById('hBadge');
  badge.textContent = info.badge || 'ALL';
  if(info.color) badge.style.background = 'linear-gradient(135deg,' + info.color + ',' + info.color + 'cc)';
  document.getElementById('hTitle').textContent = info.title || '';
  document.getElementById('hSub').textContent = info.subtitle || '';
  renderList();
  fitMap();
}

function setFilter(f){
  cFil = f; cIdx = -1;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  renderList();
  fitMap();
}

/* ---------- 載入 ---------- */
async function loadData(){
  try{
    const res = await fetch('./spots.json', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();

    document.getElementById('tripTitle').textContent = DATA.tripTitle || '行程表';
    document.getElementById('tripDate').textContent = DATA.tripDate || '';
    document.title = DATA.tripTitle || '行程表';

    const nb = document.getElementById('notesBar');
    (DATA.notes || []).forEach(n => {
      const sp = document.createElement('span');
      const b = document.createElement('strong');
      b.textContent = (n.label || '') + '：';
      sp.appendChild(b);
      sp.appendChild(document.createTextNode(n.text || ''));
      nb.appendChild(sp);
    });

    days = Array.isArray(DATA.days) ? DATA.days : [];
    const tabs = document.getElementById('dayTabs');
    days.forEach(d => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'dtab' + (d.day === 0 ? ' active' : '');
      btn.dataset.day = String(d.day);

      const l1 = document.createElement('div');
      l1.className = 'dd';
      l1.textContent = d.day === 0 ? '全部' : ('Day ' + d.day);
      btn.appendChild(l1);

      if(d.day !== 0 && d.subtitle){
        const l2 = document.createElement('div');
        l2.className = 'dl';
        l2.textContent = String(d.subtitle).split('｜')[0];
        btn.appendChild(l2);
      }
      btn.addEventListener('click', () => setDay(d.day));
      tabs.appendChild(btn);
    });

    const fb = document.getElementById('filterBar');
    FILTERS.forEach(f => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'fbtn' + (f.key === 'all' ? ' active' : '');
      b.dataset.f = f.key;
      b.textContent = f.label;
      b.addEventListener('click', () => setFilter(f.key));
      fb.appendChild(b);
    });

    spots = Array.isArray(DATA.spots) ? DATA.spots : [];

    document.getElementById('prevBtn').addEventListener('click', () => nav(-1));
    document.getElementById('nextBtn').addEventListener('click', () => nav(1));
    document.addEventListener('keydown', e => {
      if(['ArrowRight','ArrowDown'].includes(e.key)){ e.preventDefault(); nav(1); }
      if(['ArrowLeft','ArrowUp'].includes(e.key)){ e.preventDefault(); nav(-1); }
    });

    setDay(0);
    document.getElementById('loading').style.display = 'none';

  }catch(err){
    console.error(err);
    const box = document.getElementById('loading');
    box.replaceChildren();
    const t = document.createElement('p');
    t.style.cssText = 'color:#c62828;font-weight:700';
    t.textContent = '無法載入 spots.json';
    const d = document.createElement('p');
    d.style.cssText = 'color:#616161;font-size:.85rem;margin-top:8px;line-height:1.6';
    d.textContent = '請確認檔案與 index.html 同一資料夾，並透過本地伺服器或已部署網址開啟（直接雙擊開啟會因瀏覽器限制失敗）。';
    const e2 = document.createElement('p');
    e2.style.cssText = 'color:#9e9e9e;font-size:.75rem;margin-top:10px';
    e2.textContent = '錯誤訊息：' + err.message;
    box.append(t, d, e2);
  }
}

loadData();
</script>
</body>
</html>
